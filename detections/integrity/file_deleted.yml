title: Monitored File Deleted or Unreadable (FIM)
id: 7a8b9c0d-1e2f-4a3b-4c5d-6e7f80911223
status: experimental
description: |
    Detects a monitored file that was present in the trusted baseline but is now
    gone or unreadable — defacement, tampering, or an attacker clearing
    evidence. Mirrors SOC-Guard's FILE_INTEGRITY_DELETED rule.
references:
    - https://attack.mitre.org/techniques/T1565/001/
author: Yordan Yordanov (darkyordanov)
date: 2026-11-23
tags:
    - attack.impact
    - attack.t1565.001
logsource:
    product: soc-guard
    category: file_integrity
detection:
    selection:
        rule: 'FILE_INTEGRITY_DELETED'
    condition: selection
fields:
    - path
falsepositives:
    - A legitimate deploy that removed or relocated a watched file
level: high
