name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint · test · validate detections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test & detection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r tests/requirements.txt

      - name: Byte-compile the collector (stdlib, no deps)
        run: python -m compileall -q src/

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run detection tests
        run: pytest

      - name: Validate Sigma rules
        run: sigma check detections/
